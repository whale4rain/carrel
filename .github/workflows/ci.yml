name: CI

# Lint, typecheck, unit tests, a build and a start-up check of the desktop
# app, on Mac and Windows, for every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Start the desktop app
        run: pnpm --filter @carrel/desktop smoke
      - name: End-to-end test of the core loop
        run: pnpm --filter @carrel/desktop e2e
      - name: Keep the end-to-end test's screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.os }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
      - name: Spike check, live web on the desk
        run: pnpm --filter @carrel/spike-web check
      - name: Spike check, video on the desk
        run: pnpm --filter @carrel/spike-video check
      - name: Spike check, video on the desk with YouTube (needs the network; reported, not required)
        continue-on-error: true
        run: pnpm --filter @carrel/spike-video check
        env:
          CARREL_SPIKE_YOUTUBE: aqz-KE-bpKQ
