<!-- @dsCard group="Desk" height=210 subtitle="Point and ask in one place" -->
<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--mat);font-family:var(--font-ui);color:var(--ink)}
.wrap{padding:28px 24px;display:flex;justify-content:center}
.composer{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;padding:12px 12px 12px 16px;border-radius:var(--radius-control);background:var(--paper);box-shadow:var(--shadow-lift)}
.points{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lead{font-family:var(--font-read);font-style:italic;font-size:13px;color:var(--ink-muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;border-radius:var(--radius-mark);font-family:var(--font-mono);font-size:12px;font-weight:500;background:var(--highlight);color:var(--highlight-ink)}
.chip button{width:18px;height:18px;border:none;background:transparent;color:var(--highlight-ink);cursor:pointer;font-size:13px;line-height:1}
.row{display:flex;align-items:center;gap:10px}
label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{flex:1;min-width:0;height:40px;border:none;background:transparent;font-family:var(--font-ui);font-size:15px;color:var(--ink);outline:none}
input::placeholder{color:var(--ink-muted)}
.send{width:40px;height:40px;border:none;border-radius:var(--radius-control);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer}
.send:focus-visible,.chip button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<div class="composer">
<div class="points">
<span class="lead">pointing at</span>
<span class="chip">12:34–13:10<button type="button" aria-label="Remove 12:34 to 13:10">×</button></span>
<span class="chip">p.42 ¶2<button type="button" aria-label="Remove page 42 paragraph 2">×</button></span>
</div>
<div class="row">
<label for="ask">Ask the agent</label>
<input id="ask" type="text" value="Why is coffee inelastic?">
<button type="button" class="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</div>
</div>
</div>
</body>
</html>
