<!-- @dsCard group="Desk" height=130 subtitle="Who is at the desk" -->
<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--mat);font-family:var(--font-ui);color:var(--ink)}
.wrap{padding:24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.seats{display:flex}
.seat{width:32px;height:32px;border-radius:var(--radius-seat);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:2px solid var(--mat)}
.seat + .seat{margin-left:-6px}
.you{background:var(--ink);color:var(--paper)}
.person{background:var(--paper);color:var(--ink)}
.agent{background:var(--paper);color:var(--pencil);font-family:var(--font-read);font-style:italic;box-shadow:inset 0 0 0 2px var(--pencil)}
.where{font-size:13px;line-height:18px}
.where i{font-family:var(--font-read);color:var(--pencil)}
.pos{font-family:var(--font-mono);font-weight:500;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="seats" aria-label="At this desk: you, Mia, the agent">
<span class="seat you">OR</span><span class="seat person">MI</span><span class="seat agent">a</span>
</div>
<span class="where">Mia is in the book at <span class="pos">p.51</span> · <i>the agent is reading the lecture at</i> <span class="pos">12:34</span></span>
</div>
</body>
</html>
