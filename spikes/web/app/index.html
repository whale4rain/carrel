<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <title>Carrel · live web spike</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; color: #1d1b17; }
      body { display: flex; flex-direction: column; background: #efece4; }
      #bar { height: 36px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid #d9d2c3; background: #f7f4ec; }
      #status b { font-weight: 600; }
      #desk {
        position: relative; flex: 1; overflow: hidden;
        background-color: #efece4;
        background-image: linear-gradient(#e2dccf 1px, transparent 1px), linear-gradient(90deg, #e2dccf 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .sheet { position: absolute; transform-origin: 0 0; background: #fffdf8; border-radius: 4px; box-shadow: 0 1px 0 #d4ccbb, 0 0 0 1px #e1dacb; overflow: hidden; }
      .sheet.active { box-shadow: 0 0 0 2px #3b5bab; }
      .head { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid #ece6d9; cursor: grab; user-select: none; }
      .head .title { flex: 1; font-weight: 500; }
      .head .tag { font: 11px ui-monospace, monospace; color: #6b6458; }
      .head button { border: 0; background: #ece6d9; border-radius: 3px; width: 20px; height: 20px; cursor: pointer; }
      .page { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; background: #fff; }
      .page img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
      .sheet.live .tag { color: #1f7a3a; }
      textarea { width: 100%; height: 100%; box-sizing: border-box; border: 0; padding: 10px; font: 14px/1.5 system-ui, sans-serif; resize: none; background: transparent; }
    </style>
  </head>
  <body>
    <div id="bar"><strong>Live web spike</strong><span id="status">Loading…</span></div>
    <div id="desk"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
